<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Square border lines (lighter blue/gray) -->
  <rect x="25" y="25" width="150" height="150" fill="none" stroke="#7f8ca8" stroke-width="6" stroke-linejoin="round"/>

  <!-- Diagonal lines from corners to center (lighter blue/gray) -->
  <line x1="25" y1="25" x2="175" y2="175" stroke="#7f8ca8" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="25" x2="25" y2="175" stroke="#7f8ca8" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Circle (filled deep navy blue with a white border/gap) -->
  <circle cx="100" cy="100" r="54" fill="#ffffff"/> <!-- White border layer -->
  <circle cx="100" cy="100" r="50" fill="#1e295d"/> <!-- Inner filled navy circle -->

  <!-- White Graduation Cap in the center of the navy circle -->
  <!-- Cap top board -->
  <polygon points="100,75 136,90 100,105 64,90" fill="#ffffff"/>
  
  <!-- Cap body underneath -->
  <path d="M 74,96 L 74,110 C 74,118 100,123 100,123 C 100,123 126,118 126,110 L 126,96" fill="#ffffff"/>

  <!-- Cap tassel string & end -->
  <path d="M 129,91.5 L 129,112 C 129,114 126.5,115.5 126.5,118" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="124.5,118 128.5,118 130,127 123,127" fill="#ffffff"/>

  <!-- Corner nodes (deep navy blue) -->
  <circle cx="25" cy="25" r="14" fill="#1e295d"/>
  <circle cx="175" cy="25" r="14" fill="#1e295d"/>
  <circle cx="25" cy="175" r="14" fill="#1e295d"/>
  <circle cx="175" cy="175" r="14" fill="#1e295d"/>
</svg>
