<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Square border lines -->
  <rect x="30" y="30" width="140" height="140" fill="none" stroke="#1e3a5f" stroke-width="8" stroke-linejoin="round"/>

  <!-- Diagonal lines from corners to circle edge -->
  <line x1="30" y1="30" x2="72" y2="72" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="30" x2="128" y2="72" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
  <line x1="30" y1="170" x2="72" y2="128" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="170" x2="128" y2="128" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round"/>

  <!-- Circle (smaller) -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#1e3a5f" stroke-width="8"/>

  <!-- Corner nodes -->
  <circle cx="30" cy="30" r="12" fill="#1e3a5f"/>
  <circle cx="170" cy="30" r="12" fill="#1e3a5f"/>
  <circle cx="30" cy="170" r="12" fill="#1e3a5f"/>
  <circle cx="170" cy="170" r="12" fill="#1e3a5f"/>

  <!-- Graduation cap body (mortarboard top flat square, rotated 45deg) -->
  <path d="M 82 100 L 100 115 L 118 100 L 100 95 Z" fill="#1e3a5f"/>

  <!-- Cap top board -->
  <polygon points="100,75 128,87 100,99 72,87" fill="#1e3a5f"/>

  <!-- Cap tassel string -->
  <path d="M 120 84.5 L 120 102 C 120 105, 123 105, 123 108" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>

  <!-- Tassel end -->
  <polygon points="121,108 125,108 126,115 120,115" fill="#1e3a5f"/>
</svg>
