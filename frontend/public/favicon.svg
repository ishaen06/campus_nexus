<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Square border lines -->
  <rect x="30" y="30" width="140" height="140" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>

  <!-- Diagonal lines from corners to circle edge -->
  <line x1="30" y1="30" x2="72" y2="72" stroke="#1e3a5f" stroke-width="2.5"/>
  <line x1="170" y1="30" x2="128" y2="72" stroke="#1e3a5f" stroke-width="2.5"/>
  <line x1="30" y1="170" x2="72" y2="128" stroke="#1e3a5f" stroke-width="2.5"/>
  <line x1="170" y1="170" x2="128" y2="128" stroke="#1e3a5f" stroke-width="2.5"/>

  <!-- Circle (smaller) -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>

  <!-- Corner nodes -->
  <circle cx="30" cy="30" r="6" fill="#1e3a5f"/>
  <circle cx="170" cy="30" r="6" fill="#1e3a5f"/>
  <circle cx="30" cy="170" r="6" fill="#1e3a5f"/>
  <circle cx="170" cy="170" r="6" fill="#1e3a5f"/>

  <!-- Graduation cap body (mortarboard top flat square, rotated 45deg) -->
  <rect x="72" y="87" width="56" height="10" rx="2" fill="#1e3a5f"/>

  <!-- Cap top board -->
  <polygon points="100,72 130,87 100,97 70,87" fill="#1e3a5f"/>

  <!-- Cap tassel string -->
  <line x1="130" y1="87" x2="130" y2="108" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tassel end -->
  <circle cx="130" cy="111" r="4" fill="#1e3a5f"/>
</svg>